# Agent-tunable parameters for standing-pd-ext

runner:
  seconds: 10.0
  # Controller update period. 0.01 = 100 Hz, 0.001 = 1 kHz
  control_dt: 0.001
  # Random seed for reproducibility (used by standing-pd-ext)
  seed: 0
  # Number of physics ticks to wait after reset before starting control
  settle_steps: 0
  # Override initial base height (z). null keeps legacy BASE_HEIGHT behavior.
  base_height: 0.679
  log_dir: "runs"
  run_name: "standing_pd_ext"

safety:
  max_roll: 1.0
  max_pitch: 1.0
  min_base_z: 0.12
  max_omega: 20.0

controller:
  # Select controller implementation:
  # - "torque_pd": torque-only PD posture hold (harder to stand up)
  # - "two_stage": position warmup then torque PD hold (recommended)
  type: "two_stage"

  # Stance target used to build q_ref.
  # Options: standing, crouch_pos, crouch_neg
  stance: standing
  # Used only when stance is crouch_pos / crouch_neg (standingでは無視されます)
  crouch_knee: 0.0
  crouch_ankle: 0.0

  # Only used when type == "two_stage"
  warmup_seconds: 1.0
  # Smooth transition from warmup(position) to hold(torque)
  # 0.0 means "no blending" (instant switch; old behavior).
  blend_seconds: 0.2

  # Warmup stage (POSITION_CONTROL)
  position:
    kp: 120.0
    kd: 2.0

  # Hold stage (TORQUE_CONTROL PD)
  torque:
    kp: 40.0
    kd: 1.5
    tau_limit: 60.0
    # Gravity compensation in hold stage (optional)
    use_gravity_comp: true
    gravity_scale: 1.0
    # Increase torque damping only during blend (warmup->hold transition).
    # 1.0 means "no change". Typical sweep: 1.0, 1.5, 2.0, 3.0
    kd_blend_factor: 1.0
